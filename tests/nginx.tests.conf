server {
    server_name 0.0.0.0;
    listen 5000;

    location /api/hassio_ingress/redacted {
        # Disable compression so sub_filter can rewrite response body
        proxy_set_header Accept-Encoding "";

        proxy_pass http://localhost:5690/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Origin "";
        proxy_cache off;
        proxy_buffering off;

        # Rewrite absolute paths for Ingress subpath simulation
        sub_filter_types text/html application/javascript text/javascript text/css application/json;
        sub_filter_once off;

        # Double-quote variants
        sub_filter 'src="/assets/' 'src="/api/hassio_ingress/redacted/assets/';
        sub_filter 'href="/assets/' 'href="/api/hassio_ingress/redacted/assets/';
        sub_filter '"/assets/' '"/api/hassio_ingress/redacted/assets/';
        sub_filter '"/rest/' '"/api/hassio_ingress/redacted/rest/';
        sub_filter '"/static/' '"/api/hassio_ingress/redacted/static/';
        sub_filter '"/types/' '"/api/hassio_ingress/redacted/types/';
        sub_filter '"/icons/' '"/api/hassio_ingress/redacted/icons/';
        sub_filter 'action="/' 'action="/api/hassio_ingress/redacted/';
        sub_filter '"/healthz' '"/api/hassio_ingress/redacted/healthz';
        sub_filter '"/oauth2-credential/' '"/api/hassio_ingress/redacted/oauth2-credential/';
        sub_filter '"/form/' '"/api/hassio_ingress/redacted/form/';

        # Single-quote variants (JS template literals / dynamic URL construction)
        sub_filter "'/assets/" "'/api/hassio_ingress/redacted/assets/";
        sub_filter "'/rest/" "'/api/hassio_ingress/redacted/rest/";
        sub_filter "'/static/" "'/api/hassio_ingress/redacted/static/";
        sub_filter "'/types/" "'/api/hassio_ingress/redacted/types/";
        sub_filter "'/icons/" "'/api/hassio_ingress/redacted/icons/";
    }
}
